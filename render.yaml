services:
  - type: worker
    name: telegram-notes-bot
    runtime: docker
    plan: starter
    autoDeploy: true
    disk:
      name: telegram-notes-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /data
